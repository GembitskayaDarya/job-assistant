plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.darya'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0'
        mavenBom 'net.javacrumbs.shedlock:shedlock-bom:7.7.0'
    }
}

ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Career History import source (Sprint 9 Step 7) - strict YAML parsing via Jackson, the
    // project-standard JSON/object mapper already brought in transitively by every Spring Boot
    // starter here. Version resolved by the Spring Boot BOM, matching every other Jackson module.
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    implementation 'org.telegram:telegrambots-springboot-longpolling-starter:10.1.0'
    implementation 'org.telegram:telegrambots-client:10.1.0'

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Sprint 10 Step 4: CV/cover-letter PDF rendering. Pure Java, Apache-2.0, no native/Chromium
    // runtime - PDDocument text is drawn directly with vector positions computed against a
    // bundled, embedded Unicode font (see src/main/resources/fonts/ttf/Inter/ below), never
    // rasterized.
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // Sprint 11 Golden Master Typography Calibration: the embedded font is now Inter (matching the
    // golden master's own typeface, see PdfBoxApplicationMaterialDocumentRenderer's "Fonts"
    // javadoc), vendored directly as classpath resources under
    // src/main/resources/fonts/ttf/Inter/ - no Maven-packaged Inter distribution with static
    // per-weight TTF files exists to depend on instead (see that directory's README.txt for exactly
    // where the files came from and their SIL Open Font License 1.1). No dependency line is needed
    // here for it, unlike the Open Sans family it replaces (previously
    // com.helger.font:ph-fonts-open-sans), since the font bytes live in this project's own
    // resources rather than a third-party jar.

    implementation 'net.javacrumbs.shedlock:shedlock-spring'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // Points spring.config.import's CANDIDATE_PROFILE_PATH placeholder at the deterministic
    // test fixture instead of the developer's real, gitignored config/candidate-profile.yml -
    // otherwise a fresh checkout without that file would fail every Spring context test.
    systemProperty 'CANDIDATE_PROFILE_PATH', file('src/test/resources/candidate-profile-test.yml').absolutePath

    // Sprint 11 Final CV Policy production fix: points spring.config.import's
    // BASELINE_CV_SELECTION_PATH placeholder at a real, resolvable test fixture, instead of the
    // developer's real, gitignored config/private/baseline-cv-selection.yml (authored against the
    // real Career History, never this suite's synthetic fixtures) - or, as this originally read,
    // a deliberately-absent path. BaselineCvSelectionResolver now fails loudly when EVERY field
    // (summary/skills/positions/personalProjects) resolves empty at once (see its
    // requireNonEmptyBaseline javadoc), so "absent = harmless empty binding" is no longer a safe
    // test assumption. src/test/resources/baseline-cv-selection-test.yml supplies only a
    // professional-summary (with empty skills/positions/personalProjects) - enough to satisfy that
    // guard without requiring this suite to seed any real Career History company/position data.
    systemProperty 'BASELINE_CV_SELECTION_PATH', file('src/test/resources/baseline-cv-selection-test.yml').absolutePath

    // Sprint 11 Golden Master Template Rendering: points GoldenMasterCvTemplateProperties'
    // CV_GOLDEN_MASTER_TEMPLATE_PATH placeholder at a synthetic, non-private fixture PDF (see
    // GoldenMasterFixture's javadoc - "JOHN DOE"/"Example Corp", no real personal data) instead of
    // the developer's real, gitignored config/private/cv/golden-master/Darya_Hembitskaya_CV.pdf -
    // GoldenMasterCvTemplate fails application startup loudly if this file is missing/invalid, so
    // every full-Spring-context test needs a real, resolvable file here, exactly like the two
    // properties above.
    systemProperty 'CV_GOLDEN_MASTER_TEMPLATE_PATH', file('src/test/resources/golden-master-cv-fixture.pdf').absolutePath

    // Sprint 11 Step 5: the default test JVM heap is too small for this suite's growing number of
    // distinct cached Spring ApplicationContext configurations (each @DataJpaTest/@SpringBootTest
    // slice keeps its own Hibernate metamodel/connection pool alive for the whole run) - without
    // this, a full run intermittently fails with OutOfMemoryError unrelated to any actual test
    // assertion.
    maxHeapSize = '4g'
}
