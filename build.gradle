plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.darya'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:1.0.0'
        mavenBom 'net.javacrumbs.shedlock:shedlock-bom:7.7.0'
    }
}

ext['testcontainers.version'] = '1.21.4'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Career History import source (Sprint 9 Step 7) - strict YAML parsing via Jackson, the
    // project-standard JSON/object mapper already brought in transitively by every Spring Boot
    // starter here. Version resolved by the Spring Boot BOM, matching every other Jackson module.
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'

    implementation 'org.telegram:telegrambots-springboot-longpolling-starter:10.1.0'
    implementation 'org.telegram:telegrambots-client:10.1.0'

    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Sprint 10 Step 4: CV/cover-letter PDF rendering. Pure Java, Apache-2.0, no native/Chromium
    // runtime - PDDocument text is drawn directly with vector positions computed against a
    // bundled, embedded Unicode font (see ph-fonts-open-sans below), never rasterized.
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'

    // Sprint 10 Step 4 (production-readiness fix): embedded Unicode font for PDF rendering.
    // Apache-2.0-licensed Maven Central wrapper bundling the Open Sans TTF family (SIL Open Font
    // License 1.1, redistribution-permitted) as classpath resources - so the exact same font bytes
    // are used on every developer machine and inside Docker, with no dependency on the host OS's
    // installed fonts and no runtime network fetch. Open Sans covers Latin, Latin Extended
    // (including Polish diacritics) and Cyrillic.
    implementation 'com.helger.font:ph-fonts-open-sans:6.1.0'

    implementation 'net.javacrumbs.shedlock:shedlock-spring'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // Points spring.config.import's CANDIDATE_PROFILE_PATH placeholder at the deterministic
    // test fixture instead of the developer's real, gitignored config/candidate-profile.yml -
    // otherwise a fresh checkout without that file would fail every Spring context test.
    systemProperty 'CANDIDATE_PROFILE_PATH', file('src/test/resources/candidate-profile-test.yml').absolutePath

    // Sprint 11 Step 5: the default test JVM heap is too small for this suite's growing number of
    // distinct cached Spring ApplicationContext configurations (each @DataJpaTest/@SpringBootTest
    // slice keeps its own Hibernate metamodel/connection pool alive for the whole run) - without
    // this, a full run intermittently fails with OutOfMemoryError unrelated to any actual test
    // assertion.
    maxHeapSize = '4g'
}
