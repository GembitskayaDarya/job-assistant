spring:
  application:
    name: job-assistant

  config:
    # The complete candidate profile (target role, skills, preferences, ...) lives outside
    # application source, so another user can supply their own without touching this file - see
    # config/candidate-profile.example.yml. Startup fails fast if the resolved path is missing.
    import: file:${CANDIDATE_PROFILE_PATH:./config/candidate-profile.yml}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: job-assistant-pool
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  ai:
    # Spring AI's own documented default is 10 (spring.ai.retry.max-attempts) - a single
    # application-level ChatClient call would otherwise silently retry up to 9 additional times
    # against the real OpenAI HTTP endpoint on any 5xx (TransientAiException). Pinned to 1 here so
    # one adapter invocation (VacancyExtractionPort/JobAnalysisAiPort) always makes exactly one
    # provider HTTP attempt - proven via MaxAttemptsRetryPolicy(1) in
    # SpringAiRetryAutoConfigurationTest. The durable VacancyRecommendationTask retry (persisted,
    # bounded, attempt_count-tracked) remains the only automatic retry for candidate-fit analysis;
    # a manual /analyze failure is surfaced to the user for a manual retry, never retried
    # transparently underneath them.
    retry:
      max-attempts: ${SPRING_AI_RETRY_MAX_ATTEMPTS:1}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_ANALYSIS_TEMPERATURE:0.2}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  token: ${TELEGRAM_BOT_TOKEN:}
  # Bounds the dedicated notification-send OkHttp transport (connect/read/write alike) - see
  # TelegramBotConfig#notificationTelegramClient. Replaces OkHttp's own unconfigurable 10s default.
  notification-send-timeout: ${TELEGRAM_NOTIFICATION_SEND_TIMEOUT:10s}

jobsource:
  remoteok:
    base-url: ${JOBSOURCE_REMOTEOK_BASE_URL:https://remoteok.com/api}
  ingestion:
    enabled: ${JOBSOURCE_INGESTION_ENABLED:false}
    fixed-delay-ms: ${JOBSOURCE_INGESTION_FIXED_DELAY_MS:3600000}
    initial-delay-ms: ${JOBSOURCE_INGESTION_INITIAL_DELAY_MS:10000}

firecrawl:
  enabled: ${FIRECRAWL_ENABLED:false}
  api-key: ${FIRECRAWL_API_KEY:}
  base-url: ${FIRECRAWL_BASE_URL:https://api.firecrawl.dev}
  search-limit: ${FIRECRAWL_SEARCH_LIMIT:10}
  connect-timeout: ${FIRECRAWL_CONNECT_TIMEOUT:5s}
  # Must stay greater than scrape-timeout below - it bounds the shared WebClient's transport-level
  # timeout for every Firecrawl call (search and scrape), not just the fast /v2/search endpoint.
  read-timeout: ${FIRECRAWL_READ_TIMEOUT:65s}
  # Per-request server-side budget sent to Firecrawl's POST /v2/scrape as "timeout" (milliseconds).
  scrape-timeout: ${FIRECRAWL_SCRAPE_TIMEOUT:60s}
  max-markdown-chars: ${FIRECRAWL_MAX_MARKDOWN_CHARS:100000}
  # Dedicated, bounded per-operation timeout for FirecrawlJobDiscoveryBudgetAdapter's single
  # GET /v2/team/credit-usage request - deliberately shorter than read-timeout above, which bounds
  # every other Firecrawl call.
  credit-usage-timeout: ${FIRECRAWL_CREDIT_USAGE_TIMEOUT:10s}
  cost:
    search-results-per-credit-block: ${FIRECRAWL_SEARCH_RESULTS_PER_CREDIT_BLOCK:10}
    search-credits-per-block: ${FIRECRAWL_SEARCH_CREDITS_PER_BLOCK:2}
    basic-scrape-credits: ${FIRECRAWL_BASIC_SCRAPE_CREDITS:1}

job-discovery:
  enabled: ${JOB_DISCOVERY_ENABLED:false}
  query-planning:
    max-queries: ${JOB_DISCOVERY_MAX_QUERIES:5}
    results-per-query: ${JOB_DISCOVERY_RESULTS_PER_QUERY:10}
    max-skills-per-query: ${JOB_DISCOVERY_MAX_SKILLS_PER_QUERY:3}
  execution:
    max-queries-per-run: ${JOB_DISCOVERY_MAX_QUERIES_PER_RUN:3}
    max-scrapes-per-run: ${JOB_DISCOVERY_MAX_SCRAPES_PER_RUN:5}
    max-extractions-per-run: ${JOB_DISCOVERY_MAX_EXTRACTIONS_PER_RUN:5}
    max-unique-references-per-run: ${JOB_DISCOVERY_MAX_UNIQUE_REFERENCES_PER_RUN:30}
    max-reported-issues: ${JOB_DISCOVERY_MAX_REPORTED_ISSUES:50}
  # Provider-neutral spend-policy limits enforced by JobDiscoveryBudgetPolicy against a verified
  # Firecrawl credit snapshot before every non-empty discovery run - see firecrawl.cost above for
  # the separate, provider-specific pricing assumptions used to produce the estimate these limits
  # are checked against.
  budget:
    monthly-credit-limit: ${JOB_DISCOVERY_MONTHLY_CREDIT_LIMIT:800}
    reserve-credits: ${JOB_DISCOVERY_RESERVE_CREDITS:200}
    max-estimated-credits-per-run: ${JOB_DISCOVERY_MAX_ESTIMATED_CREDITS_PER_RUN:15}
  # Optional daily trigger for JobDiscoveryService, off by default. lock-at-most-for must stay
  # comfortably larger than the slowest expected discovery run (bounded by the execution limits
  # above) and shorter than the interval between cron occurrences, so a crashed node's stale lock
  # can never suppress the next legitimate run indefinitely.
  scheduler:
    enabled: ${JOB_DISCOVERY_SCHEDULER_ENABLED:false}
    cron: ${JOB_DISCOVERY_SCHEDULER_CRON:0 0 8 * * *}
    zone: ${JOB_DISCOVERY_SCHEDULER_ZONE:Europe/Warsaw}
    lock-at-most-for: ${JOB_DISCOVERY_LOCK_AT_MOST_FOR:2h}
    lock-at-least-for: ${JOB_DISCOVERY_LOCK_AT_LEAST_FOR:1m}

vacancy-import:
  session-ttl: ${VACANCY_IMPORT_SESSION_TTL:24h}
  cleanup:
    enabled: ${VACANCY_IMPORT_CLEANUP_ENABLED:true}
    fixed-delay: ${VACANCY_IMPORT_CLEANUP_FIXED_DELAY:1h}
    initial-delay: ${VACANCY_IMPORT_CLEANUP_INITIAL_DELAY:1m}
    batch-size: ${VACANCY_IMPORT_CLEANUP_BATCH_SIZE:100}

job-analysis:
  claim-stale-after: ${JOB_ANALYSIS_CLAIM_STALE_AFTER:2m}

vacancy-extraction:
  max-input-chars: ${VACANCY_EXTRACTION_MAX_INPUT_CHARS:40000}
  tail-input-chars: ${VACANCY_EXTRACTION_TAIL_INPUT_CHARS:10000}

vacancy-canonical-url-audit:
  enabled: ${VACANCY_CANONICAL_URL_AUDIT_ENABLED:false}
  batch-size: ${VACANCY_CANONICAL_URL_AUDIT_BATCH_SIZE:500}
  max-reported-issues: ${VACANCY_CANONICAL_URL_AUDIT_MAX_REPORTED_ISSUES:100}

vacancy-canonical-url-backfill:
  enabled: ${VACANCY_CANONICAL_URL_BACKFILL_ENABLED:false}
  mode: ${VACANCY_CANONICAL_URL_BACKFILL_MODE:DRY_RUN}
  batch-size: ${VACANCY_CANONICAL_URL_BACKFILL_BATCH_SIZE:500}

job-monitoring:
  enabled: ${JOB_MONITORING_ENABLED:false}
  fixed-delay: ${JOB_MONITORING_FIXED_DELAY:30m}
  initial-delay: ${JOB_MONITORING_INITIAL_DELAY:1m}
  keyword: ${JOB_MONITORING_KEYWORD:java backend}
  max-notifications: ${JOB_MONITORING_MAX_NOTIFICATIONS:5}
  recipient-chat-id: ${JOB_MONITORING_RECIPIENT_CHAT_ID:}

# The single shared "is this AI match score good enough to notify about" threshold - used by both
# job-monitoring above and vacancy-recommendation below. Previously job-monitoring.minimum-score
# (JOB_MONITORING_MINIMUM_SCORE); moved here in Sprint 8 Step 10 so the two workflows can never be
# configured with two different thresholds for the same business decision. Same default (70) as
# before the move.
recommendation-policy:
  minimum-score: ${RECOMMENDATION_MINIMUM_SCORE:70}

# Sprint 8 Step 10: durable analysis + Telegram notification pipeline for automatic web-discovery
# vacancies. Disabled by default. Enabling it requires Job Analysis (always available) and
# Telegram (telegram.enabled=true) - missing infrastructure fails startup clearly rather than the
# processing service being silently omitted.
vacancy-recommendation:
  enabled: ${VACANCY_RECOMMENDATION_ENABLED:false}
  recipient-chat-id: ${VACANCY_RECOMMENDATION_RECIPIENT_CHAT_ID:}
  processing:
    batch-size: ${VACANCY_RECOMMENDATION_BATCH_SIZE:5}
    max-attempts: ${VACANCY_RECOMMENDATION_MAX_ATTEMPTS:3}
    lease-duration: ${VACANCY_RECOMMENDATION_LEASE_DURATION:20m}
    retry-initial-delay: ${VACANCY_RECOMMENDATION_RETRY_INITIAL_DELAY:10m}
    retry-max-delay: ${VACANCY_RECOMMENDATION_RETRY_MAX_DELAY:2h}
  # lock-at-most-for must stay greater than processing.lease-duration above: ShedLock's cluster
  # -wide lock must never be released while this node could still legitimately be working through
  # a claimed batch (the task lease is the crash-recovery bound within that).
  scheduler:
    enabled: ${VACANCY_RECOMMENDATION_SCHEDULER_ENABLED:false}
    fixed-delay: ${VACANCY_RECOMMENDATION_FIXED_DELAY:10m}
    initial-delay: ${VACANCY_RECOMMENDATION_INITIAL_DELAY:1m}
    lock-at-most-for: ${VACANCY_RECOMMENDATION_LOCK_AT_MOST_FOR:1h}
    lock-at-least-for: ${VACANCY_RECOMMENDATION_LOCK_AT_LEAST_FOR:10s}

webclient:
  timeout-ms: ${WEBCLIENT_TIMEOUT_MS:20000}
  max-connections: ${WEBCLIENT_MAX_CONNECTIONS:50}
  max-idle-time-ms: ${WEBCLIENT_MAX_IDLE_TIME_MS:30000}
  max-life-time-ms: ${WEBCLIENT_MAX_LIFE_TIME_MS:300000}
  pending-acquire-timeout-ms: ${WEBCLIENT_PENDING_ACQUIRE_TIMEOUT_MS:10000}
  evict-in-background-ms: ${WEBCLIENT_EVICT_IN_BACKGROUND_MS:60000}
  max-in-memory-size-bytes: ${WEBCLIENT_MAX_IN_MEMORY_SIZE_BYTES:2097152}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.darya.jobassistant: ${LOG_LEVEL_APP:INFO}
    com.darya.jobassistant.scheduler: ${LOG_LEVEL_SCHEDULER:INFO}
    com.darya.jobassistant.monitoring: ${LOG_LEVEL_MONITORING:INFO}
    com.darya.jobassistant.vacancies.maintenance: ${LOG_LEVEL_VACANCY_MAINTENANCE:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}
    org.flywaydb: INFO
