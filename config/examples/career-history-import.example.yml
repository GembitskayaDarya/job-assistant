# Career History import source - EXAMPLE / TEMPLATE ONLY.
#
# Every value below is fictional (Example Systems, Zenith Robotics, Demo Backend Engineer, ...) -
# this file is tracked in git and must stay that way. Your real Career History belongs in
# config/career-history.yml instead (see .gitignore - that exact path is ignored; this example
# file is explicitly re-included so it stays tracked).
#
# Usage:
#   cp config/examples/career-history-import.example.yml config/career-history.yml
#   # edit config/career-history.yml with your own real career data
#   CAREER_HISTORY_IMPORT_MODE=DRY_RUN CAREER_HISTORY_IMPORT_SOURCE=file:./config/career-history.yml ./gradlew bootRun
#
# See README.md's "Career History import" section for the full DRY_RUN/APPLY workflow, the
# expected-version update rule, and what each field means.

schemaVersion: 1

# Must match an existing candidate_profile.profile_key row - import never creates one automatically.
candidateProfileKey: primary

# Leave unset (or omit entirely) for a first import (create). Set it to the version reported by a
# prior DRY_RUN/APPLY result when you intend to update an existing Career History - see README.md.
