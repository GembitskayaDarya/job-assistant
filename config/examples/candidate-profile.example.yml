# Example candidate profile - a copyable template, not real personal data.
#
# First-time setup:
#   cp config/candidate-profile.example.yml config/candidate-profile.yml
# then edit the values below to describe yourself. config/candidate-profile.yml is gitignored,
# so your personal data never gets committed.
#
# Most of `candidate:` feeds the AI vacancy-analysis prompt (JobAnalysisService): target
# role/seniority/experience, skills with proficiency, languages, and work preferences.
#
# The `full-name`/`email`/`phone`/`linkedin-url`/`cv-location`/`cv-headline`/`education`/
# `personal-projects` fields below (Sprint 11 Step 5) are the exception: fixed, factual
# CV-presentation data that JobAnalysisService never reads and AI never generates or rewrites.
# `cv-headline` is deliberately separate from `target-role` above - target-role drives job
# search/matching, cv-headline is the fixed title printed on the CV document itself.
candidate:
  # Role and seniority you're targeting - used to judge fit against a vacancy's stated role.
  target-role: Senior Java Backend Developer
  target-seniority: Senior

  # Total years of professional experience, compared against a vacancy's stated requirement
  # (if any) - a small gap has a small effect on the AI match score, not an automatic zero.
  experience-years: 5

  # Acceptance correction: structured entries - both `language` and `proficiency` are required.
  # List position determines CV presentation order (first entry = displayOrder 0, etc.) - there is
  # no separate order field to keep in sync.
  languages:
    - language: English
      proficiency: Fluent

  # A skill absent from this list is treated as unknown, negligible, or intentionally excluded -
  # don't add an entry just to say "no". Supported proficiency values, most to least confident:
  #   EXPERT   - deep knowledge, can design solutions and guide others
  #   STRONG   - confident production experience, can troubleshoot difficult problems
  #   WORKING  - can independently complete normal implementation tasks
  #   BASIC    - understands the fundamentals, may need guidance for non-trivial work
  # NONE is not a supported value - just omit skills you don't have.
  skills:
    - name: Java
      proficiency: STRONG
    - name: Spring Boot
      proficiency: WORKING
    - name: Docker
      proficiency: BASIC
    - name: PostgreSQL
      proficiency: EXPERT

  preferences:
    # Country you currently work/live from.
    current-country: Poland

    # Work arrangement you prefer, and how much it should weigh in the match score:
    # REQUIRED (a conflict significantly hurts the score), STRONG (important but not
    # disqualifying), PREFERRED (small influence), or NEUTRAL (no score impact).
    preferred-work-arrangement: Remote
    work-arrangement-importance: STRONG

    # Countries you're able to work from/for, regardless of arrangement.
    allowed-work-countries:
      - Poland
    relocation-allowed: false

    preferred-contract-types:
      - B2B
    contract-type-importance: PREFERRED

    preferred-company-type: Product
    company-type-importance: PREFERRED

    # Leave blank if you don't want salary to influence the AI match score at all.
    salary-expectation:

  # --- Fixed factual CV-presentation data (Sprint 11 Step 5) - never read for AI matching, never AI-generated ---

  # All optional; leave any of these blank if you don't want them on the CV yet.
  full-name:
  email:
  phone:
  linkedin-url:
  cv-location: Warsaw, Poland
  cv-headline: Senior Java Backend Engineer

  # Only institution is required per entry - leave degree/field-of-study blank if the factual
  # source only has university/faculty information.
  education:
    - institution: Example University
      degree: BSc Computer Science
      field-of-study: Computer Science
      location: Warsaw, Poland
      start-date: 2014-09-01
      end-date: 2018-06-30

  # Factual source projects only - AI may later select/order highlights or technologies from
  # these, but must never invent a project, a highlight, or a technology.
  #
  # `id` is REQUIRED and must be a fixed UUID you assign yourself and never change - it is this
  # project's stable identity across every import run. Generate one once (e.g. `uuidgen` on
  # macOS/Linux) and keep it: the bootstrap import matches on this id, not on `name`, so renaming
  # a project is safe but changing its id creates a second, duplicate project on the next import.
  personal-projects:
    - id: 00000000-0000-0000-0000-000000000001
      name: Example Side Project
      description: A short factual description of what the project does.
      url: https://github.com/example/example-project
      start-date: 2022-01-01
      end-date:
      highlights:
        - A factual highlight bullet about this project.
      technologies:
        - name: Java
          category: Language
        - name: PostgreSQL
          category: Database
