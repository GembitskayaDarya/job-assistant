services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-job_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  telegram-bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-job_assistant}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JOBSOURCE_INGESTION_ENABLED: ${JOBSOURCE_INGESTION_ENABLED:-false}
      JOB_MONITORING_ENABLED: ${JOB_MONITORING_ENABLED:-false}
      JOB_MONITORING_FIXED_DELAY: ${JOB_MONITORING_FIXED_DELAY:-30m}
      JOB_MONITORING_INITIAL_DELAY: ${JOB_MONITORING_INITIAL_DELAY:-1m}
      JOB_MONITORING_KEYWORD: ${JOB_MONITORING_KEYWORD:-java backend}
      JOB_MONITORING_MINIMUM_SCORE: ${JOB_MONITORING_MINIMUM_SCORE:-70}
      JOB_MONITORING_MAX_NOTIFICATIONS: ${JOB_MONITORING_MAX_NOTIFICATIONS:-5}
      JOB_MONITORING_RECIPIENT_CHAT_ID: ${JOB_MONITORING_RECIPIENT_CHAT_ID:-}
      LOG_LEVEL_SCHEDULER: ${LOG_LEVEL_SCHEDULER:-INFO}
      LOG_LEVEL_MONITORING: ${LOG_LEVEL_MONITORING:-INFO}
      # Firecrawl-backed job discovery - previously missing here, so these always fell back to
      # application.yml's disabled-by-default values (FIRECRAWL_ENABLED/JOB_DISCOVERY_ENABLED
      # both default to false) regardless of what .env set, and the discovery beans/scheduler
      # were silently never created.
      FIRECRAWL_ENABLED: ${FIRECRAWL_ENABLED:-false}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev}
      FIRECRAWL_SEARCH_LIMIT: ${FIRECRAWL_SEARCH_LIMIT:-10}
      FIRECRAWL_CONNECT_TIMEOUT: ${FIRECRAWL_CONNECT_TIMEOUT:-5s}
      FIRECRAWL_READ_TIMEOUT: ${FIRECRAWL_READ_TIMEOUT:-65s}
      FIRECRAWL_SCRAPE_TIMEOUT: ${FIRECRAWL_SCRAPE_TIMEOUT:-60s}
      FIRECRAWL_MAX_MARKDOWN_CHARS: ${FIRECRAWL_MAX_MARKDOWN_CHARS:-100000}
      FIRECRAWL_CREDIT_USAGE_TIMEOUT: ${FIRECRAWL_CREDIT_USAGE_TIMEOUT:-10s}
      FIRECRAWL_SEARCH_RESULTS_PER_CREDIT_BLOCK: ${FIRECRAWL_SEARCH_RESULTS_PER_CREDIT_BLOCK:-10}
      FIRECRAWL_SEARCH_CREDITS_PER_BLOCK: ${FIRECRAWL_SEARCH_CREDITS_PER_BLOCK:-2}
      FIRECRAWL_BASIC_SCRAPE_CREDITS: ${FIRECRAWL_BASIC_SCRAPE_CREDITS:-1}
      JOB_DISCOVERY_ENABLED: ${JOB_DISCOVERY_ENABLED:-false}
      JOB_DISCOVERY_MAX_QUERIES: ${JOB_DISCOVERY_MAX_QUERIES:-5}
      JOB_DISCOVERY_RESULTS_PER_QUERY: ${JOB_DISCOVERY_RESULTS_PER_QUERY:-10}
      JOB_DISCOVERY_MAX_SKILLS_PER_QUERY: ${JOB_DISCOVERY_MAX_SKILLS_PER_QUERY:-3}
      JOB_DISCOVERY_MAX_QUERIES_PER_RUN: ${JOB_DISCOVERY_MAX_QUERIES_PER_RUN:-3}
      JOB_DISCOVERY_MAX_SCRAPES_PER_RUN: ${JOB_DISCOVERY_MAX_SCRAPES_PER_RUN:-5}
      JOB_DISCOVERY_MAX_EXTRACTIONS_PER_RUN: ${JOB_DISCOVERY_MAX_EXTRACTIONS_PER_RUN:-5}
      JOB_DISCOVERY_MAX_UNIQUE_REFERENCES_PER_RUN: ${JOB_DISCOVERY_MAX_UNIQUE_REFERENCES_PER_RUN:-30}
      JOB_DISCOVERY_MAX_REPORTED_ISSUES: ${JOB_DISCOVERY_MAX_REPORTED_ISSUES:-50}
      JOB_DISCOVERY_MONTHLY_CREDIT_LIMIT: ${JOB_DISCOVERY_MONTHLY_CREDIT_LIMIT:-800}
      JOB_DISCOVERY_RESERVE_CREDITS: ${JOB_DISCOVERY_RESERVE_CREDITS:-200}
      JOB_DISCOVERY_MAX_ESTIMATED_CREDITS_PER_RUN: ${JOB_DISCOVERY_MAX_ESTIMATED_CREDITS_PER_RUN:-15}
      JOB_DISCOVERY_SCHEDULER_ENABLED: ${JOB_DISCOVERY_SCHEDULER_ENABLED:-false}
      JOB_DISCOVERY_SCHEDULER_CRON: ${JOB_DISCOVERY_SCHEDULER_CRON:-0 0 8 * * *}
      JOB_DISCOVERY_SCHEDULER_ZONE: ${JOB_DISCOVERY_SCHEDULER_ZONE:-Europe/Warsaw}
      JOB_DISCOVERY_LOCK_AT_MOST_FOR: ${JOB_DISCOVERY_LOCK_AT_MOST_FOR:-2h}
      JOB_DISCOVERY_LOCK_AT_LEAST_FOR: ${JOB_DISCOVERY_LOCK_AT_LEAST_FOR:-1m}
      # Bridges Firecrawl-discovered vacancies to AI analysis + Telegram notification - same
      # missing-wiring bug as the FIRECRAWL_*/JOB_DISCOVERY_* block above. Without this,
      # VacancyRecommendationTask rows created by job discovery are persisted but never claimed,
      # analyzed, or sent.
      VACANCY_RECOMMENDATION_ENABLED: ${VACANCY_RECOMMENDATION_ENABLED:-false}
      VACANCY_RECOMMENDATION_RECIPIENT_CHAT_ID: ${VACANCY_RECOMMENDATION_RECIPIENT_CHAT_ID:-}
      VACANCY_RECOMMENDATION_BATCH_SIZE: ${VACANCY_RECOMMENDATION_BATCH_SIZE:-5}
      VACANCY_RECOMMENDATION_MAX_ATTEMPTS: ${VACANCY_RECOMMENDATION_MAX_ATTEMPTS:-3}
      VACANCY_RECOMMENDATION_LEASE_DURATION: ${VACANCY_RECOMMENDATION_LEASE_DURATION:-20m}
      VACANCY_RECOMMENDATION_RETRY_INITIAL_DELAY: ${VACANCY_RECOMMENDATION_RETRY_INITIAL_DELAY:-10m}
      VACANCY_RECOMMENDATION_RETRY_MAX_DELAY: ${VACANCY_RECOMMENDATION_RETRY_MAX_DELAY:-2h}
      VACANCY_RECOMMENDATION_SCHEDULER_ENABLED: ${VACANCY_RECOMMENDATION_SCHEDULER_ENABLED:-false}
      VACANCY_RECOMMENDATION_FIXED_DELAY: ${VACANCY_RECOMMENDATION_FIXED_DELAY:-10m}
      VACANCY_RECOMMENDATION_INITIAL_DELAY: ${VACANCY_RECOMMENDATION_INITIAL_DELAY:-1m}
      VACANCY_RECOMMENDATION_LOCK_AT_MOST_FOR: ${VACANCY_RECOMMENDATION_LOCK_AT_MOST_FOR:-1h}
      VACANCY_RECOMMENDATION_LOCK_AT_LEAST_FOR: ${VACANCY_RECOMMENDATION_LOCK_AT_LEAST_FOR:-10s}
    volumes:
      - ./config/candidate-profile.yml:/app/config/candidate-profile.yml:ro
      # Sprint 11 Final CV Policy production fix: this was the ONLY missing mount - without it,
      # BaselineCvSelectionProperties bound to an empty default on every container startup (the
      # file simply didn't exist inside the container), so BaselineCvSelectionResolver silently
      # produced a near-empty approved CV (no Professional Summary, no experience bullets, no
      # Personal Project) for every real generation the live bot ever produced. config/career-
      # history.yml is deliberately NOT mounted here - it is only read once, on the host, via the
      # CareerHistoryImportRunner one-off import flow, and its content already lives in the shared
      # Postgres database the container connects to.
      - ./config/private/baseline-cv-selection.yml:/app/config/private/baseline-cv-selection.yml:ro
      # Sprint 11 Golden Master Template Rendering: the approved reference CV PDF itself -
      # GoldenMasterCvTemplate reads this as a plain binary file at startup and fails loudly if it
      # is missing (see cv-golden-master-template.path in application.yml). Read-only, like every
      # other private config mount here - the container only ever reads this file, it never writes
      # to it.
      - ./config/private/cv/golden-master/Darya_Hembitskaya_CV.pdf:/app/config/private/cv/golden-master/Darya_Hembitskaya_CV.pdf:ro
      # Sprint 10 Step 4 (production-readiness fix): rendered CV/cover-letter PDFs
      # (application-materials.storage.local.root-directory, default ./data/application-materials
      # resolved against the image's /app WORKDIR). A bind mount, not a named volume - local dev
      # workflow calls for opening a just-generated PDF directly from the host filesystem to check
      # it, and ./data/application-materials is already gitignored for exactly this path. Survives
      # container rebuilds/restarts the same as a named volume would, since it lives on the host.
      - ./data/application-materials:/app/data/application-materials
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
